<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Detail - Coki Store</title>
    <style>
        :root {
            --manga-black: #111111;
            --manga-white: #ffffff;
            --manga-gray: #f4f4f4;
            --border-light: #e0e0e0; /* 浅灰色淡化分割线 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--manga-gray); color: var(--manga-black); padding-bottom: 80px; }

        /* Header - 使用淡化后的边框 */
        .header {
            background: var(--manga-white); padding: 12px 16px; 
            display: flex; align-items: center; border-bottom: 1px solid var(--border-light); 
            position: sticky; top: 0; z-index: 10;
        }
        .back-btn { font-size: 13px; color: var(--manga-black); text-decoration: none; font-weight: 800; background: var(--manga-white); border: 1.5px solid var(--border-light); padding: 4px 10px; border-radius: 12px; }
        .back-btn:active { background: var(--manga-gray); }
        .header-title { flex-grow: 1; text-align: center; font-size: 14px; font-weight: 900; margin-right: 40px; }

        /* Image Gallery Slider - 使用淡化分割线 */
        .gallery-container { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #fff; border-bottom: 1px solid var(--border-light); overflow: hidden; }
        .gallery-track { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -ms-overflow-style: none; }
        .gallery-track::-webkit-scrollbar { display: none; }
        .gallery-slide { flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: start; }
        .gallery-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* Page Indicator Badge (e.g. 1/5) */
        .image-counter {
            position: absolute; bottom: 12px; right: 12px;
            background: rgba(17, 17, 17, 0.7); color: var(--manga-white);
            font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 10px;
            pointer-events: none; letter-spacing: 1px;
        }

        /* Product Info Box - 淡化底部边框 */
        .info-box { background: var(--manga-white); padding: 16px; border-bottom: 1px solid var(--border-light); margin-bottom: 12px; }
        .price { color: var(--manga-black); font-size: 20px; font-weight: 900; margin-bottom: 6px; }
        .title { font-size: 14px; font-weight: 800; line-height: 1.4; color: #222; }

        /* Specs Section */
        .section-title { font-size: 11px; font-weight: 800; margin: 16px 16px 8px 16px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Specs Box - 换成精致的浅边框和轻量阴影 */
        .specs-box { 
            background: var(--manga-white); border: 1px solid var(--border-light); border-radius: 10px; 
            margin: 0 16px; padding: 14px; font-size: 12px; font-weight: 700; line-height: 1.6; color: #444; 
            white-space: pre-wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.03); margin-bottom: 16px; 
        }

        /* Detail Images Section (下方长图) */
        .detail-images-container { width: 100%; display: flex; flex-direction: column; gap: 4px; }
        .detail-images-container img { width: 100%; display: block; }

        /* Loading & Error */
        .loading, .error { text-align: center; padding: 60px 20px; font-weight: 800; color: #888; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">‹ Back</a>
        <div class="header-title">Product Details</div>
    </div>

    <div id="content">
        <div class="loading">Loading product details...</div>
    </div>

<script>
    async function loadDetail() {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const container = document.getElementById('content');

        if (!productId) {
            container.innerHTML = '<div class="error">Product not found.</div>';
            return;
        }

        try {
            const res = await fetch('products.json?t=' + new Date().getTime());
            if (!res.ok) throw new Error("Failed to load products data");
            
            const products = await res.json();
            const product = products.find(p => String(p.id) === String(productId));

            if (!product) {
                container.innerHTML = '<div class="error">This product is no longer available.</div>';
                return;
            }

            let images = [];
            if (product.detailImages && product.detailImages.length > 0) {
                images = product.detailImages;
            } else if (product.image) {
                images = [product.image];
            } else {
                images = ['https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500'];
            }

            const totalImages = images.length;

            let slidesHtml = '';
            images.forEach((imgUrl) => {
                slidesHtml += `
                    <div class="gallery-slide">
                        <img src="${imgUrl}" onerror="this.src='https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500'">
                    </div>
                `;
            });

            let detailImagesHtml = '';
            images.forEach((imgUrl) => {
                detailImagesHtml += `<img src="${imgUrl}" onerror="this.src='https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500'">`;
            });

            const pTitle = product.title || product.name || 'Untitled';
            const pPrice = Number(product.price || 0).toLocaleString();
            const pSpecs = product.specs || product.description || 'No specific details provided.';

            container.innerHTML = `
                <div class="gallery-container">
                    <div class="gallery-track" id="gallery-track" onscroll="updateImageCounter(${totalImages})">
                        ${slidesHtml}
                    </div>
                    <div class="image-counter" id="img-counter">1 / ${totalImages}</div>
                </div>

                <div class="info-box">
                    <div class="price">${pPrice} MMK</div>
                    <h2 class="title">${escapeHtml(pTitle)}</h2>
                </div>

                <div class="section-title">Specifications & Description</div>
                <div class="specs-box">${escapeHtml(pSpecs)}</div>

                <div class="section-title">Product Details Gallery</div>
                <div class="detail-images-container">
                    ${detailImagesHtml}
                </div>
            `;

        } catch (e) {
            container.innerHTML = '<div class="error">Failed to load details. Please check network.</div>';
        }
    }

    function updateImageCounter(total) {
        const track = document.getElementById('gallery-track');
        if (!track) return;
        const scrollLeft = track.scrollLeft;
        const slideWidth = track.clientWidth;
        const currentIndex = Math.round(scrollLeft / slideWidth) + 1;
        const counter = document.getElementById('img-counter');
        if (counter) {
            counter.innerText = `${currentIndex} / ${total}`;
        }
    }

    function escapeHtml(str) { 
        return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : ''; 
    }

    loadDetail();
</script>
</body>
</html>
