<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coki shop — 后台管理系统</title>
  <!-- 引入 Supabase 核心库 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f4f6; margin: 0; padding: 16px; }
    .card { background: #fff; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 2px solid #111; padding-bottom: 8px; }
    input, button { width: 100%; box-sizing: border-box; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
    button { background: #111; color: #fff; font-weight: bold; border: none; cursor: pointer; }
    .item { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
    .item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    .del-btn { background: #ff4d4f; width: auto; padding: 6px 12px; margin: 0; }
  </style>
</head>
<body>

  <div class="card" id="login-box">
    <h2>🔐 后台登录</h2>
    <input type="password" id="admin-pass" placeholder="输入后台密码 (默认: 888888)">
    <button onclick="login()">登录管理后台</button>
  </div>

  <div class="card" id="admin-box" style="display:none;">
    <h2>➕ 上架新商品</h2>
    <input type="text" id="p-name" placeholder="商品名称 (例如: 多功能带镜收纳盒)">
    <input type="number" id="p-price" placeholder="价格 (例如: 40000)">
    <input type="text" id="p-image" placeholder="图片文件名或网络URL (例如: item1.jpg)">
    <input type="text" id="p-badge" placeholder="标签 (例如: 🔥 热销款)">
    <button onclick="addProduct()">发布到前台</button>

    <h2 style="margin-top: 30px;">📦 在售商品列表</h2>
    <div id="product-list">加载中...</div>
  </div>

  <script>
    // 项目专属配置
    const SUPABASE_URL = 'https://keaokbwzveijlntfcjn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fdwg49L6AQlqlj4MApcuaQ_4YZF3M6Z';

    let db;

    function login() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === '888888') {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('admin-box').style.display = 'block';

        // 初始化 Supabase 数据库
        try {
          if (typeof supabase !== 'undefined') {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            loadProducts();
          } else {
            alert('网络加载 SDK 失败，请刷新页面重试');
          }
        } catch(e) {
          alert('配置错误: ' + e.message);
        }
      } else {
        alert('密码错误！');
      }
    }

    async function loadProducts() {
      try {
        const { data, error } = await db.from('products').select('*').order('id', { ascending: false });
        if (error) throw error;

        let html = '';
        if (data && data.length > 0) {
          data.forEach(p => {
            html += `
              <div class="item">
                <img src="${p.image}" onerror="this.src='https://via.placeholder.com/50'">
                <div style="flex:1; margin-left:10px;">
                  <div style="font-weight:bold;">${p.name}</div>
                  <div style="color:#666;">${Number(p.price).toLocaleString()} MMK</div>
                </div>
                <button class="del-btn" onclick="deleteProduct(${p.id})">下架</button>
              </div>
            `;
          });
        } else {
          html = '暂无商品';
        }
        document.getElementById('product-list').innerHTML = html;
      } catch (err) {
        alert('读取数据失败: ' + err.message);
      }
    }

    async function addProduct() {
      const name = document.getElementById('p-name').value;
      const price = document.getElementById('p-price').value;
      const image = document.getElementById('p-image').value;
      const badge = document.getElementById('p-badge').value;

      if(!name || !price || !image) return alert('请完整填写名称、价格和图片');

      try {
        const { error } = await db.from('products').insert([{ name, price: Number(price), image, badge }]);
        if (error) throw error;

        alert('🎉 上架成功！');
        document.getElementById('p-name').value = '';
        document.getElementById('p-price').value = '';
        document.getElementById('p-image').value = '';
        document.getElementById('p-badge').value = '';
        loadProducts();
      } catch (err) {
        alert('添加失败: ' + err.message);
      }
    }

    async function deleteProduct(id) {
      if(!confirm('确定要下架该商品吗？')) return;
      try {
        const { error } = await db.from('products').delete().eq('id', id);
        if (error) throw error;
        loadProducts();
      } catch (err) {
        alert('下架失败: ' + err.message);
      }
    }
  </script>
</body>
</html>
