<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coki Store - 商品后台管理</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #f9f9f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #ff4757; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #ff6b81; }
        .success { color: green; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Coki Store - 管理后台</h2>

    <!-- GitHub 配置卡片 -->
    <div class="card">
        <h3>1. GitHub 配置 (保存一次即可)</h3>
        <label>GitHub 用户名:</label>
        <input type="text" id="username" placeholder="例如: thihasanid-ship-it">
        
        <label>仓库名称 (Repo):</label>
        <input type="text" id="repo" placeholder="例如: Cokishop">
        
        <label>GitHub Token (PAT):</label>
        <input type="password" id="token" placeholder="粘贴你的 Token">
        
        <button onclick="saveConfig()">保存配置</button>
        <div id="configStatus" class="success"></div>
    </div>

    <!-- 发布商品卡片 -->
    <div class="card">
        <h3>2. 发布新商品</h3>
        <label>商品名称:</label>
        <input type="text" id="title" placeholder="例如: 少女心化妆品收纳盒">
        
        <label>价格 (缅币):</label>
        <input type="text" id="price" placeholder="例如: 63500">
        
        <label>封面主图链接 (Image URL):</label>
        <input type="text" id="image" placeholder="https://raw.githubusercontent.com/.../item3.jpg">

        <label>详情图链接 (多张可用逗号隔开):</label>
        <textarea id="detailImages" rows="2" placeholder="输入更多细节图链接，用英文逗号隔开"></textarea>

        <label>规格说明 / 详情描述:</label>
        <textarea id="specs" rows="3" placeholder="例如: 材质: 环保木塑板 | 尺寸: 30x20x15cm | 颜色: 白色"></textarea>
        
        <button onclick="publishProduct()">立即发布商品</button>
        <div id="publishStatus" class="success"></div>
    </div>

<script>
    // 页面加载时自动读取本地配置
    window.onload = function() {
        if(localStorage.getItem('gh_username')) document.getElementById('username').value = localStorage.getItem('gh_username');
        if(localStorage.getItem('gh_repo')) document.getElementById('repo').value = localStorage.getItem('gh_repo');
        if(localStorage.getItem('gh_token')) document.getElementById('token').value = localStorage.getItem('gh_token');
    }

    function saveConfig() {
        localStorage.setItem('gh_username', document.getElementById('username').value);
        localStorage.setItem('gh_repo', document.getElementById('repo').value);
        localStorage.setItem('gh_token', document.getElementById('token').value);
        document.getElementById('configStatus').innerText = "配置保存成功！";
    }

    async function publishProduct() {
        const username = document.getElementById('username').value;
        const repo = document.getElementById('repo').value;
        const token = document.getElementById('token').value;

        if(!username || !repo || !token) {
            alert('请先完整填写并保存 GitHub 配置！');
            return;
        }

        const title = document.getElementById('title').value;
        const price = document.getElementById('price').value;
        const image = document.getElementById('image').value;
        const detailImages = document.getElementById('detailImages').value;
        const specs = document.getElementById('specs').value;

        if(!title || !price || !image) {
            alert('商品名称、价格和封面图不能为空！');
            return;
        }

        document.getElementById('publishStatus').innerText = "正在发布，请稍候...";

        const path = "products.json";
        const url = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

        try {
            // 1. 获取现有 products.json 的内容和 sha
            let sha = "";
            let products = [];
            const getRes = await fetch(url, {
                headers: { 'Authorization': `token ${token}` }
            });

            if(getRes.ok) {
                const fileData = await getRes.json();
                sha = fileData.sha;
                // 解码 base64 内容
                const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
                products = JSON.parse(decodedContent);
            }

            // 2. 组装新商品数据 (用时间戳当作唯一 id)
            const newProduct = {
                id: Date.now(),
                title: title,
                price: price,
                image: image,
                detailImages: detailImages ? detailImages.split(',').map(s => s.trim()) : [image],
                specs: specs || "暂无详细规格"
            };

            products.unshift(newProduct); // 放到最前面

            // 3. 编码回 base64 并提交更新到 GitHub
            const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));

            const putRes = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: "Add new product via admin panel",
                    content: updatedContent,
                    sha: sha
                })
            });

            if(putRes.ok) {
                document.getElementById('publishStatus').innerText = "商品发布成功！前台已同步更新。";
                document.getElementById('title').value = '';
                document.getElementById('price').value = '';
                document.getElementById('image').value = '';
                document.getElementById('detailImages').value = '';
                document.getElementById('specs').value = '';
            } else {
                const errText = await putRes.text();
                document.getElementById('publishStatus').innerText = "发布失败: " + errText;
            }

        } catch (e) {
            document.getElementById('publishStatus').innerText = "发生错误: " + e.message;
        }
    }
</script>
</body>
</html>
