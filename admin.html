<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coki Admin Panel</title>
  <style>
    :root {
      --manga-black: #111111;
      --manga-white: #ffffff;
      --manga-gray: #f4f4f4;
      --border-light: #e0e0e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--manga-gray); color: var(--manga-black); padding: 20px 16px 80px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .title { font-size: 18px; font-weight: 900; }
    
    .card {
      background: var(--manga-white);
      border: 2px solid var(--manga-black);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 3px 3px 0px var(--manga-black);
    }

    .card-title { font-size: 14px; font-weight: 900; margin-bottom: 12px; }

    .input-field {
      width: 100%; background: var(--manga-white);
      border: 2px solid var(--manga-black); padding: 10px 12px; border-radius: 8px;
      font-size: 12px; font-weight: 700; margin-bottom: 10px; outline: none;
    }

    .btn {
      width: 100%; background: var(--manga-black); color: var(--manga-white);
      border: 2px solid var(--manga-black); padding: 12px; border-radius: 8px;
      font-weight: 900; font-size: 12px; cursor: pointer; text-align: center;
    }
    .btn:active { transform: translate(2px, 2px); }

    .product-list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border-light);
    }
    .product-info-text { font-size: 12px; font-weight: 800; }
    .product-price-text { font-size: 11px; font-weight: 700; color: #666; }
    
    .delete-btn {
      background: #ef4444; color: #fff; border: 2px solid var(--manga-black);
      padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">🛠️ Coki Admin Panel</div>
    <a href="index.html" style="font-size: 11px; font-weight: 900; color: #0095f6; text-decoration: none;">← View Store</a>
  </div>

  <!-- Add Product Form -->
  <div class="card">
    <div class="card-title">➕ Add New Product</div>
    <input type="text" class="input-field" id="p-name" placeholder="Product Name (e.g., Cute Hoodie)">
    <input type="number" class="input-field" id="p-price" placeholder="Price in MMK (e.g., 15000)">
    <input type="text" class="input-field" id="p-image" placeholder="Image URL (GitHub raw link or image link)">
    <input type="text" class="input-field" id="p-badge" placeholder="Badge (Optional, e.g., HOT / NEW)">
    <button class="btn" onclick="addProduct()">Publish Product</button>
  </div>

  <!-- Product Management List -->
  <div class="card">
    <div class="card-title">📦 Existing Products</div>
    <div id="admin-product-list">
      <div style="font-size: 11px; font-weight: 700; color: #888; text-align: center; padding: 20px 0;">Loading list...</div>
    </div>
  </div>

  <script>
    const CONFIG = {
      baseUrl: 'https://keaokbwzveijlntfcjn.supabase.co/rest/v1/products',
      apiKey: 'Sb_publishable_fdwg49L6AQlqlj4MApcuaQ_4YZF3M6Z'
    };

    async function loadAdminProducts() {
      try {
        const res = await fetch(`${CONFIG.baseUrl}?select=*&order=id.desc`, {
          headers: { 'apikey': CONFIG.apiKey, 'Authorization': `Bearer ${CONFIG.apiKey}` }
        });
        if (!res.ok) throw new Error('Fetch failed');
        const data = await res.json();
        
        const listContainer = document.getElementById('admin-product-list');
        if (!data || data.length === 0) {
          listContainer.innerHTML = '<div style="font-size: 11px; font-weight: 700; color: #888; text-align: center; padding: 20px 0;">No products found.</div>';
          return;
        }

        listContainer.innerHTML = data.map(p => `
          <div class="product-list-item">
            <div>
              <div class="product-info-text">${escapeHtml(p.name)}</div>
              <div class="product-price-text">${Number(p.price).toLocaleString()} MMK</div>
            </div>
            <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function addProduct() {
      const name = document.getElementById('p-name').value.trim();
      const price = document.getElementById('p-price').value.trim();
      const image = document.getElementById('p-image').value.trim();
      const badge = document.getElementById('p-badge').value.trim();

      if (!name || !price || !image) {
        alert('Please fill in Name, Price, and Image URL!');
        return;
      }

      try {
        const res = await fetch(CONFIG.baseUrl, {
          method: 'POST',
          headers: {
            'apikey': CONFIG.apiKey,
            'Authorization': `Bearer ${CONFIG.apiKey}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ name, price: Number(price), image, badge })
        });

        if (!res.ok) throw new Error('Failed to add product');

        alert('🎉 Product added successfully!');
        document.getElementById('p-name').value = '';
        document.getElementById('p-price').value = '';
        document.getElementById('p-image').value = '';
        document.getElementById('p-badge').value = '';
        loadAdminProducts();
      } catch (err) {
        alert('Error adding product. Please check console.');
        console.error(err);
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;

      try {
        const res = await fetch(`${CONFIG.baseUrl}?id=eq.${id}`, {
          method: 'DELETE',
          headers: {
            'apikey': CONFIG.apiKey,
            'Authorization': `Bearer ${CONFIG.apiKey}`
          }
        });

        if (!res.ok) throw new Error('Failed to delete');
        loadAdminProducts();
      } catch (err) {
        alert('Error deleting product.');
        console.error(err);
      }
    }

    function escapeHtml(str) { return str ? str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : ''; }

    loadAdminProducts();
  </script>
</body>
</html>
