<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coki Shop - 得物潮流馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 70px;
            position: relative;
            min-height: 100vh;
        }

        /* 顶部 Header */
        .header {
            background-color: #1a1a1a;
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a2a;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .back-icon, .action-icons span {
            font-size: 18px;
            cursor: pointer;
            color: #fff;
        }

        .action-icons span {
            margin-left: 16px;
        }

        .shop-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .shop-logo {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-right: 12px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #00f0ff;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .shop-detail {
            flex: 1;
        }

        .shop-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .verified-tag {
            background: #00f0ff;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .shop-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        .btn-follow {
            border: none;
            background: #00f0ff;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-follow.followed {
            background: #333;
            color: #888;
        }
