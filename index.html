<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coki official page — 官方精选</title>
  <style>
    :root {
      --manga-black: #111111;
      --manga-white: #ffffff;
      --manga-gray: #f4f4f4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--manga-gray); color: var(--manga-black); padding-bottom: 100px; }

    /* 顶部公告栏 (全英文) */
    .ticker-bar { background: var(--manga-black); color: var(--manga-white); font-size: 11px; font-weight: 700; padding: 8px 12px; text-align: center; letter-spacing: 1px; }

    /* 顶栏 Header - 模仿拼多多旗舰店横向布局 */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--manga-white);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--manga-black);
    }
    
    .store-info { display: flex; align-items: center; gap: 10px; }
    
    /* 左侧圆形 Logo */
    .store-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      border: 2px solid var(--manga-black);
      object-fit: cover; background: #fff;
    }

    /* 右侧文字与蓝标同行 */
    .store-text-group { display: flex; flex-direction: column; justify-content: center; }
    .store-name-row { 
      font-size: 15px; font-weight: 900; letter-spacing: -0.3px; 
      display: flex; align-items: center; gap: 4px; color: var(--manga-black);
    }
    .store-sub-row { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; margin-top: 1px; }

    /* 标准正圆形SVG蓝勾勾 */
    .verified-icon {
      width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center;
      vertical-align: middle; flex-shrink: 0;
    }

    /* 购物车按钮 */
    .cart-btn {
      background: var(--manga-white);
      border: 2px solid var(--manga-black);
      padding: 6px 12px; border-radius: 18px;
      font-size: 11px; font-weight: 800;
      display: flex; align-items: center; gap: 4px;
      box-shadow: 2px 2px 0px var(--manga-black);
      cursor: pointer; transition: all 0.1s;
    }
    .cart-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--manga-black); }
    .cart-badge { background: var(--manga-black); color: var(--manga-white); border: 1px solid var(--manga-black); font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 8px; }

    /* Banner 海报 */
    .banner-container { padding: 14px 16px 8px; }
    .hero-banner {
      background: var(--manga-black);
      color: var(--manga-white);
      border: 2px solid var(--manga-black);
      border-radius: 14px; padding: 18px 16px; 
      box-shadow: 4px 4px 0px #ccc;
    }
    .banner-tag { background: var(--manga-white); color: var(--manga-black); font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
    .banner-title { font-size: 18px; font-weight: 900; margin-bottom: 3px; }
    .banner-desc { font-size: 11px; font-weight: 600; color: #aaa; }

    /* 商品网格 */
    .section-title { padding: 14px 16px 8px; font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px; }

    /* 商品卡片 */
    .product-card {
      background: var(--manga-white);
      border: 2px solid var(--manga-black);
      border-radius: 10px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 3px 3px 0px var(--manga-black);
    }
    .img-wrapper { width: 100%; aspect-ratio: 1 / 1; background: #eee; border-bottom: 2px solid var(--manga-black); position: relative; }
    .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .hot-badge {
      position: absolute; top: 6px; left: 6px;
      background: var(--manga-black); color: var(--manga-white);
      font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 4px;
    }

    .product-info { padding: 10px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
    .product-name { font-size: 12px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price-bar { display: flex; justify-content: space-between; align-items: center; }
    .price-num { font-size: 13px; font-weight: 900; }
    .price-unit { font-size: 9px; font-weight: 800; color: #666; }

    .add-btn {
      background: var(--manga-white); color: var(--manga-black);
      border: 2px solid var(--manga-black); padding: 5px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 900; cursor: pointer;
      box-shadow: 2px 2px 0px var(--manga-black);
    }
    .add-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--manga-black); }

    /* 底部结算栏 */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: var(--manga-white); border-top: 2px solid var(--manga-black);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .total-label { font-size: 9px; font-weight: 800; color: #666; text-transform: uppercase; }
    .total-amount { font-size: 16px; font-weight: 900; }
    
    .checkout-now-btn {
      background: var(--manga-black); color: var(--manga-white);
      border: 2px solid var(--manga-black); padding: 10px 20px; border-radius: 16px;
      font-weight: 900; font-size: 12px; cursor: pointer;
      box-shadow: 2px 2px 0px #888;
    }

    /* 弹窗 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200; display: none; align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }
    .checkout-card {
      background: var(--manga-white); width: 100%; 
      border-radius: 20px 20px 0 0; border-top: 2px solid var(--manga-black);
      padding: 20px 16px 30px; animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-title { font-size: 16px; font-weight: 900; }
    .close-btn { background: var(--manga-white); border: 2px solid var(--manga-black); width: 26px; height: 26px; border-radius: 50%; font-size: 13px; font-weight: 900; cursor: pointer; }

    .order-summary-box { background: var(--manga-gray); border: 2px solid var(--manga-black); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: 11px; font-weight: 700; max-height: 100px; overflow-y: auto; }
    
    .input-field {
      width: 100%; box-sizing: border-box; background: var(--manga-white);
      border: 2px solid var(--manga-black); padding: 12px 14px; border-radius: 10px;
      font-size: 12px; font-weight: 700; margin-bottom: 10px; outline: none;
      box-shadow: 2px 2px 0px var(--manga-black);
    }

    .submit-order-btn {
      width: 100%; background: var(--manga-black); color: var(--manga-white);
      border: 2px solid var(--manga-black); padding: 14px; border-radius: 12px;
      font-weight: 900; font-size: 13px; cursor: pointer; margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- 顶部小公告栏 (全英文) -->
  <div class="ticker-bar">✨ OFFICIAL STORE · Cash on Delivery (COD) Available Nationwide</div>

  <!-- Header 导航 - 拼多多旗舰店风格布局 -->
  <header>
    <div class="store-info">
      <!-- 左侧：已直接填入你的 Logo 图片直链 -->
      <img src="https://raw.githubusercontent.com/thihasanid-ship-it/Cokishop/refs/heads/main/d3edc28c3ca009c6423fc4fe30de650d.png" alt="Coki Logo" class="store-avatar">
      
      <!-- 右侧：Coki Official Page 连排 + 正圆蓝标 -->
      <div class="store-text-group">
        <div class="store-name-row">
          Coki Official Page
          <span class="verified-icon" title="Verified Official">
            <svg viewBox="0 0 24 24" width="14" height="14">
              <circle cx="12" cy="12" r="12" fill="#0095f6"/>
              <path d="M7 12.5l3.5 3.5 7-7" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </span>
        </div>
        <div class="store-sub-row">Verified Flagship Store</div>
      </div>
    </div>

    <div class="cart-btn" onclick="openCheckout()">
      🛒 清单 <span class="cart-badge" id="cart-count">0</span>
    </div>
  </header>

  <!-- Banner 海报 -->
  <div class="banner-container">
    <div class="hero-banner">
      <span class="banner-tag">OFFICIAL STORE</span>
      <h2 class="banner-title">Coki 官方精选</h2>
      <p class="banner-desc">TikTok 粉丝专属认证 · 严选好物直发</p>
    </div>
  </div>

  <div class="section-title">📦 在售商品 (Products)</div>

  <!-- 商品网格 -->
  <div class="product-grid" id="main-product-grid">
    <div style="grid-column: span 2; text-align: center; color: #888; padding: 40px 0; font-size: 12px; font-weight: 700;">
      正在加载官方商品...
    </div>
  </div>

  <!-- 底部结算栏 -->
  <div class="bottom-bar">
    <div>
      <div class="total-label">Total Amount</div>
      <div class="total-amount" id="total-price-display">0 MMK</div>
    </div>
    <button class="checkout-now-btn" onclick="openCheckout()">立即结算</button>
  </div>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="checkout-modal">
    <div class="checkout-card">
      <div class="modal-header">
        <b class="modal-title">📦 填写送货信息</b>
        <button class="close-btn" onclick="closeCheckout()">✕</button>
      </div>
      <div id="order-summary" class="order-summary-box"></div>
      <input type="text" class="input-field" id="cust-name" placeholder="您的姓名 (Name)">
      <input type="tel" class="input-field" id="cust-phone" placeholder="联系电话 (Phone)">
      <input type="text" class="input-field" id="cust-address" placeholder="送货地址 (City / Township)">
      
      <p style="font-size: 11px; font-weight: 700; color: #666; text-align: center; margin: 8px 0;">
        💡 提交后将自动复制订单，请发送给官方客服
      </p>

      <button class="submit-order-btn" onclick="sendOrder()">提交订单并复制</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      baseUrl: 'https://keaokbwzveijlntfcjn.supabase.co/rest/v1/products',
      apiKey: 'Sb_publishable_fdwg49L6AQlqlj4MApcuaQ_4YZF3M6Z'
    };

    let cart = [];
    let totalPrice = 0;

    async function loadProducts() {
      const grid = document.getElementById('main-product-grid');
      try {
        const res = await fetch(`${CONFIG.baseUrl}?select=*&order=id.desc`, {
          headers: { 'apikey': CONFIG.apiKey, 'Authorization': `Bearer ${CONFIG.apiKey}` }
        });

        if (!res.ok) throw new Error('网络请求失败');
        const data = await res.json();

        if (!data || data.length === 0) {
          grid.innerHTML = '<div style="grid-column: span 2; text-align: center; font-weight: 700; padding: 40px 0;">暂无上架商品，请先去后台添加</div>';
          return;
        }

        grid.innerHTML = data.map(p => `
          <div class="product-card">
            <div class="img-wrapper">
              <img src="${p.image}" onerror="this.src='https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500'">
              ${p.badge ? `<div class="hot-badge">${escapeHtml(p.badge)}</div>` : ''}
            </div>
            <div class="product-info">
              <div class="product-name">${escapeHtml(p.name)}</div>
              <div class="price-bar">
                <div>
                  <span class="price-num">${Number(p.price).toLocaleString()}</span>
                  <span class="price-unit">MMK</span>
                </div>
                <button class="add-btn" onclick="addToCart('${escapeHtml(p.name)}', ${p.price})">＋ 选择</button>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        grid.innerHTML = `<div style="grid-column: span 2; text-align: center; font-weight: 700; padding: 30px 0; color: #333;">加载失败，请检查网络或刷新页面</div>`;
      }
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      totalPrice += price;
      document.getElementById('cart-count').innerText = cart.length;
      document.getElementById('total-price-display').innerText = totalPrice.toLocaleString() + ' MMK';
    }

    function openCheckout() {
      if (cart.length === 0) return alert('请先挑选商品哦！');
      let summary = cart.map((item, i) => `<div style="margin-bottom:6px; display:flex; justify-content:space-between;"><span>${i + 1}. ${item.name}</span> <span>${item.price.toLocaleString()} MMK</span></div>`).join('');
      document.getElementById('order-summary').innerHTML = summary;
      document.getElementById('checkout-modal').classList.add('active');
    }

    function closeCheckout() { document.getElementById('checkout-modal').classList.remove('active'); }

    function sendOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();

      if (!name || !phone || !address) return alert('请把名字、电话和地址都填上哦！');

      let msg = `🛒【Coki Official 新订单】\n👤 姓名: ${name}\n📞 电话: ${phone}\n📍 地址: ${address}\n\n📦 购买清单:\n`;
      cart.forEach((item, i) => { msg += `${i + 1}. ${item.name} (${item.price.toLocaleString()} MMK)\n`; });
      msg += `\n💰 合计: ${totalPrice.toLocaleString()} MMK (COD货到付款)`;

      navigator.clipboard.writeText(msg).then(() => {
        alert("🎉 订单复制成功！请粘贴发送给官方客服。");
        closeCheckout();
      }).catch(() => {
        alert("复制失败，请截图当前屏幕发给客服。");
      });
    }

    function escapeHtml(str) { return str ? str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : ''; }

    loadProducts();
  </script>
</body>
</html>
