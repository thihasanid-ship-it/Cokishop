<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop - 得物潮流馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 70px;
            position: relative;
            min-height: 100vh;
        }

        /* 顶部 Header */
        .header {
            background-color: #1a1a1a;
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a2a;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .back-icon, .action-icons span {
            font-size: 18px;
            cursor: pointer;
            color: #fff;
        }

        .action-icons span {
            margin-left: 16px;
        }

        .shop-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .shop-logo {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-right: 12px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #00f0ff;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .shop-detail {
            flex: 1;
        }

        .shop-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .verified-tag {
            background: #00f0ff;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .shop-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        .btn-follow {
            border: none;
            background: #00f0ff;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-follow.followed {
            background: #333;
            color: #888;
        }

        /* 正品鉴别保障条 */
        .auth-banner {
            background: linear-gradient(90deg, #1f242d 0%, #111419 100%);
            border: 1px solid #2d3545;
            color: #a5b4fc;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
        }

        /* 导航 Tab 栏 */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #1a1a1a;
            border-bottom: 1px solid #262626;
            padding: 12px 0;
            font-size: 14px;
        }

        .nav-item {
            color: #888;
            font-weight: 500;
            position: relative;
            cursor: pointer;
            padding: 2px 4px;
        }

        .nav-item.active {
            color: #fff;
            font-weight: bold;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background-color: #00f0ff;
            border-radius: 2px;
        }

        /* 排序筛选栏 */
        .filter-bar {
            display: flex;
            justify-content: space-around;
            background: #121212;
            padding: 12px 0;
            font-size: 12px;
            color: #777;
        }

        .filter-item {
            cursor: pointer;
        }

        .filter-item.active {
            color: #00f0ff;
            font-weight: bold;
        }

        /* 双列商品流 */
        .goods-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 10px;
        }

        .goods-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #262626;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .goods-card:active {
            transform: scale(0.98);
        }

        .goods-img-wrap {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background: #222;
        }

        .goods-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #00f0ff;
            text-align: center;
            padding: 10px;
            background-size: cover;
            background-position: center;
        }

        .dewu-tag {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 2px;
            backdrop-filter: blur(2px);
        }

        .goods-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .goods-title {
            font-size: 13px;
            line-height: 1.4;
            color: #eee;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-weight: 500;
        }

        .goods-price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 6px;
        }

        .price-symbol {
            font-size: 12px;
            color: #fff;
            font-weight: bold;
        }

        .price-num {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            font-family: "Arial Black", Gadget, sans-serif;
        }

        .want-num {
            font-size: 10px;
            color: #666;
        }

        /* 评论列表样式 */
        .reviews-list {
            padding: 10px 16px;
        }

        .review-item {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #262626;
            margin-bottom: 10px;
        }

        .review-user {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .review-text {
            font-size: 13px;
            color: #eee;
            line-height: 1.4;
        }

        .content-placeholder {
            padding: 40px 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        /* 底部领券栏 */
        .bottom-promo-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: #00f0ff;
            color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 -4px 20px rgba(0,240,255,0.15);
            cursor: pointer;
            z-index: 100;
        }

        .promo-text span {
            background: #000;
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 4px;
            font-size: 11px;
        }

        /* 看图弹窗 */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .modal-img-box {
            width: 80vw;
            height: 80vw;
            max-width: 320px;
            max-height: 320px;
            border-radius: 8px;
            border: 1px solid #00f0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #00f0ff;
        }

        .modal-title {
            color: #fff;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            padding: 0 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 店铺 Header -->
    <div class="header">
        <div class="top-bar">
            <span class="back-icon" onclick="alert('返回上一页')">❮</span>
            <div class="action-icons">
                <span onclick="alert('开启搜索')">🔍</span>
                <span onclick="alert('已复制分享链接')">↗</span>
            </div>
        </div>

        <div class="shop-info">
            <div class="shop-logo">COKI</div>
            <div class="shop-detail">
                <div class="shop-title-row">
                    <span class="shop-name">COKI SHOP</span>
                    <span class="verified-tag">品牌直营</span>
                </div>
                <div class="shop-stats">
                    <span>潮流买手店</span>
                    <span>•</span>
                    <span id="follow-count">12.8万人想要</span>
                </div>
            </div>
            <div class="shop-actions">
                <button class="btn-follow" id="btnFollow" onclick="toggleFollow()">+ 关注</button>
            </div>
        </div>

        <div class="auth-banner" onclick="alert('得物正品保障：平台统一查验、鉴别真伪后再发货。')">
            <span>🛡️ 正品保障 · 逐件查验 · 极速发货</span>
            <span style="color: #666;">❯</span>
        </div>
    </div>

    <!-- 1. 顶部 Tab 导航（替换为你指定的四个） -->
    <div class="nav-tabs">
        <div class="nav-item active" onclick="switchTab(this, 'featured')">精选商品</div>
        <div class="nav-item" onclick="switchTab(this, 'all')">全部商品</div>
        <div class="nav-item" onclick="switchTab(this, 'reviews')">评价</div>
        <div class="nav-item" onclick="switchTab(this, 'dynamic')">店铺动态</div>
    </div>

    <!-- 排序筛选栏 -->
    <div class="filter-bar" id="filterBar">
        <div class="filter-item active" onclick="switchFilter(this)">综合</div>
        <div class="filter-item" onclick="switchFilter(this)">销量</div>
        <div class="filter-item" onclick="switchFilter(this)">价格 ⇅</div>
        <div class="filter-item" onclick="switchFilter(this)">极速发货</div>
    </div>

    <!-- 内容展示区域 -->
    <div id="mainContainer">
        <div class="goods-grid" id="goodsContainer"></div>
    </div>

    <!-- 底部领券栏 -->
    <div class="bottom-promo-bar" onclick="alert('恭喜！优惠券 [满300减30] 已成功领取')">
        <div class="promo-text">
            <span>COKI</span> 得物专属：全场满¥300立减¥30
        </div>
        <div>点击领券 ❯</div>
    </div>

    <!-- 大图查看弹窗 -->
    <div class="image-modal" id="imageModal" onclick="closeModal()">
        <div class="modal-close" onclick="closeModal()">✕</div>
        <div class="modal-img-box" id="modalImgBox"></div>
        <div class="modal-title" id="modalTitle"></div>
    </div>

    <script>
        // 1. 精选商品
        const featuredProducts = [
            { id: 1, title: 'COKI 24SS 重磅美式复古宽松连帽卫衣', price: 329, sales: '2341人付款', tag: '鉴别通过', bg: 'linear-gradient(135deg, #1e293b, #0f172a)', label: 'COKI Hoodie' },
            { id: 2, title: 'COKI x Street 联名款厚底解构运动鞋', price: 589, sales: '8920人付款', tag: '极速到家', bg: 'linear-gradient(135deg, #331832, #110912)', label: 'COKI Sneaker' }
        ];

        // 2. 全部商品
        const allProducts = [
            ...featuredProducts,
            { id: 3, title: 'COKI 潮牌纯棉印花短袖T恤 男女同款', price: 169, sales: '1.2万人付款', tag: '鉴别通过', bg: 'linear-gradient(135deg, #14281d, #09120d)', label: 'COKI Tee' },
            { id: 4, title: 'COKI 棒球帽潮牌美式弯檐鸭舌帽', price: 99, sales: '4510人付款', tag: '鉴别通过', bg: 'linear-gradient(135deg, #2b1c11, #120b06)', label: 'COKI Cap' },
            { id: 5, title: 'COKI 刺绣水洗牛仔夹克外套', price: 459, sales: '890人付款', tag: '新品鉴别', bg: 'linear-gradient(135deg, #112233, #08111a)', label: 'COKI Jacket' },
            { id: 6, title: 'COKI 极简黑武士机能工装裤', price: 299, sales: '1500人付款', tag: '极速发货', bg: 'linear-gradient(135deg, #222222, #111111)', label: 'COKI Pants' }
        ];

        // 3. 评价数据
        const reviewsData = [
            { user: '潮人***88', text: '卫衣面料非常厚实，版型绝了！得物鉴别包装很专业，过验无误。', time: '2026-03-20' },
            { user: 'K***G', text: '鞋子发货速度极快，隔天就到了，颜值在线，上脚包裹感很好！', time: '2026-03-18' },
            { user: '发财***呀', text: 'T恤纯棉质量很好，摸起来很有质感，满意！', time: '2026-03-15' }
        ];

        // 渲染商品网格
        function renderProducts(list) {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="goods-grid">
                    ${list.map(item => `
                        <div class="goods-card" onclick="openModal('${item.bg}', '${item.label}', '${item.title}')">
                            <div class="goods-img-wrap">
                                <div class="goods-img" style="background: ${item.bg}">${item.label}</div>
                                <div class="dewu-tag">${item.tag}</div>
                            </div>
                            <div class="goods-info">
                                <div class="goods-title">${item.title}</div>
                                <div class="goods-price-row">
                                    <div>
                                        <span class="price-symbol">¥</span>
                                        <span class="price-num">${item.price}</span>
                                    </div>
                                    <span class="want-num">${item.sales}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 渲染评价列表
        function renderReviews() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="reviews-list">
                    ${reviewsData.map(r => `
                        <div class="review-item">
                            <div class="review-user">
                                <span>${r.user}</span>
                                <span>${r.time}</span>
                            </div>
                            <div class="review-text">“ ${r.text} ”</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Tab 切换逻辑
        function switchTab(element, type) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const filterBar = document.getElementById('filterBar');

            if (type === 'featured') {
                filterBar.style.display = 'flex';
                renderProducts(featuredProducts);
            } else if (type === 'all') {
                filterBar.style.display = 'flex';
                renderProducts(allProducts);
            } else if (type === 'reviews') {
                filterBar.style.display = 'none';
                renderReviews();
            } else if (type === 'dynamic') {
                filterBar.style.display = 'none';
                document.getElementById('mainContainer').innerHTML = '<div class="content-placeholder">📢 店铺动态：COKI 2026SS 爆款限时复刻，全场领券立减！</div>';
            }
        }

        // 筛选逻辑
        function switchFilter(element) {
            document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        // 关注状态
        let isFollowed = false;
        function toggleFollow() {
            const btn = document.getElementById('btnFollow');
            isFollowed = !isFollowed;
            btn.innerText = isFollowed ? '已关注' : '+ 关注';
            btn.classList.toggle('followed', isFollowed);
        }

        // 点击看图弹窗
        function openModal(bg, label, title) {
            const box = document.getElementById('modalImgBox');
            box.style.background = bg;
            box.innerText = label;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        // 初始化
        renderProducts(featuredProducts);
    </script>
</body>
</html>
