<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coki — 用户注册 / 登录</title>
  <style>
    :root {
      --dewu-black: #121212;
      --dewu-cyan: #00f0ff;
      --dewu-neon: #ccff00;
      --bg-gray: #f8f8f8;
      --border-gray: #e5e5e5;
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--dewu-black);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
    }

    /* 1. 顶部 Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .back-btn {
      font-size: 20px;
      color: #fff;
      cursor: pointer;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.5px;
    }

    .brand-logo span { color: var(--dewu-cyan); }

    /* 2. 标语与切换栏 */
    .hero-text {
      margin: 30px 0 20px;
    }

    .hero-text h1 {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .hero-text p {
      font-size: 13px;
      color: #888;
    }

    /* 白色卡片容器 */
    .auth-card {
      background: #ffffff;
      color: var(--dewu-black);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .tab-bar {
      display: flex;
      gap: 20px;
      border-bottom: 2px solid var(--border-gray);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .tab-item {
      font-size: 16px;
      font-weight: 800;
      color: #a0a0a0;
      cursor: pointer;
      position: relative;
    }

    .tab-item.active {
      color: var(--dewu-black);
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--dewu-black);
      border-radius: 2px;
    }

    /* 表单输入框 */
    .input-group {
      margin-bottom: 14px;
    }

    .input-box {
      width: 100%;
      background: #f4f4f6;
      border: 1px solid transparent;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      color: #111;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-box:focus {
      border-color: var(--dewu-black);
      background: #fff;
    }

    .code-row {
      display: flex;
      gap: 10px;
    }

    .send-btn {
      background: #eee;
      border: none;
      padding: 0 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 700;
      color: #444;
      white-space: nowrap;
      cursor: pointer;
    }

    /* 提交主按钮 */
    .submit-btn {
      width: 100%;
      background: var(--dewu-black);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 800;
      margin-top: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .submit-btn:active {
      transform: scale(0.97);
      background: #333;
    }

    /* 3. 快捷登录/第三方授权 */
    .social-divider {
      display: flex;
      align-items: center;
      margin: 30px 0 20px;
      color: #666;
      font-size: 12px;
    }

    .social-divider::before, .social-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #333;
    }

    .social-divider span {
      padding: 0 12px;
    }

    .social-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .social-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .social-btn:active { transform: scale(0.98); }

    /* 各品牌色彩细节 */
    .btn-fb { background: #1877f2; border: none; }
    .btn-tiktok { background: #000000; border: 1px solid #333; color: #fff; }
    .btn-google { background: #ffffff; color: #111; border: none; }

    .social-icon {
      font-size: 18px;
    }

    /* 底部条款 */
    .terms {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 25px;
    }

    .terms a {
      color: var(--dewu-cyan);
      text-decoration: none;
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-50px);
      background: var(--dewu-neon);
      color: var(--dewu-black);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 900;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 2000;
      pointer-events: none;
    }

    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div>
    <div class="top-bar">
      <div class="back-btn" onclick="notify('返回上一页')">‹</div>
      <div class="brand-logo">COKI<span>.POIZON</span></div>
      <div style="width: 36px;"></div>
    </div>

    <div class="hero-text">
      <h1>加入 COKI<br>探索潮流生活</h1>
      <p>注册即可享受首单专属折扣与免费鉴别服务</p>
    </div>

    <div class="auth-card">
      <div class="tab-bar">
        <div class="tab-item active" id="tab-reg" onclick="switchTab('reg')">新用户注册</div>
        <div class="tab-item" id="tab-login" onclick="switchTab('login')">账号登录</div>
      </div>

      <div class="input-group">
        <input type="text" class="input-box" placeholder="请输入手机号 / 邮箱">
      </div>

      <div class="input-group code-row">
        <input type="text" class="input-box" placeholder="请输入验证码">
        <button class="send-btn" onclick="notify('验证码已发送！')">获取验证码</button>
      </div>

      <div class="input-group">
        <input type="password" class="input-box" placeholder="设置密码 (8-20位数字与字母)">
      </div>

      <button class="submit-btn" id="sub-btn" onclick="notify('🎉 注册成功！欢迎加入 Coki')">立即注册</button>
    </div>
  </div>

  <div>
    <div class="social-divider">
      <span>第三方快捷登录</span>
    </div>

    <div class="social-list">
      <button class="social-btn btn-fb" onclick="notify('🌐 正在调起 Facebook 快捷登录...')">
        <span class="social-icon">📘</span> 使用 Facebook 快捷登录
      </button>

      <button class="social-btn btn-tiktok" onclick="notify('🎵 正在调起 TikTok 授权登录...')">
        <span class="social-icon">🎵</span> 使用 TikTok 快捷登录
      </button>

      <button class="social-btn btn-google" onclick="notify('🔍 正在调起 Google 快捷登录...')">
        <span class="social-icon">🌐</span> 使用 Google 账号登录
      </button>
    </div>

    <div class="terms">
      注册即代表同意 Coki <a href="#">服务条款</a> 与 <a href="#">隐私政策</a>
    </div>
  </div>

  <div id="toast">提示信息</div>

  <script>
    function switchTab(type) {
      const regTab = document.getElementById('tab-reg');
      const loginTab = document.getElementById('tab-login');
      const subBtn = document.getElementById('sub-btn');

      if (type === 'reg') {
        regTab.classList.add('active');
        loginTab.classList.remove('active');
        subBtn.innerText = '立即注册';
      } else {
        loginTab.classList.add('active');
        regTab.classList.remove('active');
        subBtn.innerText = '安全登录';
      }
    }

    let timer;
    function notify(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }
  </script>
</body>
</html>
