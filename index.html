<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coki Shop - 得物潮流馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 70px;
            position: relative;
            min-height: 100vh;
        }

        /* 顶部 Header */
        .header {
            background-color: #1a1a1a;
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a2a;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .back-icon, .action-icons span {
            font-size: 18px;
            cursor: pointer;
            color: #fff;
        }

        .action-icons span {
            margin-left: 16px;
        }

        .shop-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .shop-logo {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-right: 12px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #00f0ff;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .shop-detail {
            flex: 1;
        }

        .shop-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .verified-tag {
            background: #00f0ff;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .shop-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        .btn-follow {
            border: none;
            background: #00f0ff;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-follow.followed {
            background: #333;
            color: #888;
        }

        /* 正品鉴别保障条 */
        .auth-banner {
            background: linear-gradient(90deg, #1f242d 0%, #111419 100%);
            border: 1px solid #2d3545;
            color: #a5b4fc;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
        }

        /* 导航 Tab */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #1a1a1a;
            border-bottom: 1px solid #262626;
            padding: 12px 0;
            font-size: 14px;
        }

        .nav-item {
            color: #888;
            font-weight: 500;
            position: relative;
            cursor: pointer;
            padding: 2px 4px;
        }

        .nav-item.active {
            color: #fff;
            font-weight: bold;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background-color: #00f0ff;
            border-radius: 2px;
        }

        /* 筛选排序栏 */
        .filter-bar {
            display: flex;
            justify-content: space-around;
            background: #121212;
            padding: 12px 0;
            font-size: 12px;
            color: #777;
        }

        .filter-item {
            cursor: pointer;
        }

        .filter-item.active {
            color: #00f0ff;
            font-weight: bold;
        }

        /* 双列商品流 */
        .goods-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 10px;
        }

        .goods-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #262626;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .goods-card:active {
            transform: scale(0.98);
        }

        .goods-img-wrap {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background: #222;
        }

        .goods-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dewu-tag {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 2px;
            backdrop-filter: blur(2px);
        }

        .goods-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .goods-title {
            font-size: 13px;
            line-height: 1.4;
            color: #eee;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-weight: 500;
        }

        .goods-price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 6px;
        }

        .price-symbol {
            font-size: 12px;
            color: #fff;
            font-weight: bold;
        }

        .price-num {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            font-family: "Arial Black", Gadget, sans-serif;
        }

        .want-num {
            font-size: 10px;
            color: #666;
        }

        /* 社区/动态等占位内容 */
        .content-placeholder {
            padding: 40px 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        /* 底部领券栏 */
        .bottom-promo-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: #00f0ff;
            color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 -4px 20px rgba(0,240,255,0.15);
            cursor: pointer;
            z-index: 100;
        }

        .promo-text span {
            background: #000;
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 4px;
            font-size: 11px;
        }

        /* 看图弹窗（Modal） */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .modal-img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .modal-title {
            color: #fff;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            padding: 0 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="top-bar">
            <span class="back-icon" onclick="alert('返回上一页')">❮</span>
            <div class="action-icons">
                <span onclick="alert('开启搜索')">🔍</span>
                <span onclick="alert('已复制分享链接')">↗</span>
            </div>
        </div>

        <div class="shop-info">
            <div class="shop-logo">COKI</div>
            <div class="shop-detail">
                <div class="shop-title-row">
                    <span class="shop-name">COKI SHOP</span>
                    <span class="verified-tag">品牌直营</span>
                </div>
                <div class="shop-stats">
                    <span>潮流买手店</span>
                    <span>•</span>
                    <span id="follow-count">12.8万人想要</span>
                </div>
            </div>
            <div class="shop-actions">
                <button class="btn-follow" id="btnFollow" onclick="toggleFollow()">+ 关注</button>
            </div>
        </div>

        <div class="auth-banner" onclick="alert('得物正品保障：平台统一查验、鉴别真伪后再发货。')">
            <span>🛡️ 正品保障 · 逐件查验 · 极速发货</span>
            <span style="color: #666;">❯</span>
        </div>
    </div>

    <div class="nav-tabs">
        <div class="nav-item active" onclick="switchTab(this, 'featured')">精选商品</div>
        <div class="nav-item" onclick="switchTab(this, 'new')">新品上架</div>
        <div class="nav-item" onclick="switchTab(this, 'community')">穿搭社区</div>
        <div class="nav-item" onclick="switchTab(this, 'dynamic')">店铺动态</div>
    </div>

    <div class="filter-bar" id="filterBar">
        <div class="filter-item active" onclick="switchFilter(this)">综合</div>
        <div class="filter-item" onclick="switchFilter(this)">销量</div>
        <div class="filter-item" onclick="switchFilter(this)">价格 ⇅</div>
        <div class="filter-item" onclick="switchFilter(this)">极速发货</div>
    </div>

    <div class="goods-grid" id="goodsContainer">
        </div>

    <div class="bottom-promo-bar" onclick="alert('恭喜！优惠券 [满300减30] 已成功领取并存入您的卡券包')">
        <div class="promo-text">
            <span>COKI</span> 得物专属：全场满¥300立减¥30
        </div>
        <div>点击领券 ❯</div>
    </div>

    <div class="image-modal" id="imageModal" onclick="closeModal()">
        <div class="modal-close" onclick="closeModal()">✕</div>
        <img class="modal-img" id="modalImg" src="" alt="大图 preview">
        <div class="modal-title" id="modalTitle"></div>
    </div>

    <script>
        // 1. 精选商品数据
        const featuredProducts = [
            { id: 1, title: 'COKI 24SS 重磅美式复古宽松连帽卫衣', price: 329, sales: '2341人付款', tag: '鉴别通过', img: 'https://via.placeholder.com/600x600/222222/00f0ff?text=COKI+Hoodie' },
            { id: 2, title: 'COKI x Street 联名款厚底解构运动鞋', price: 589, sales: '8920人付款', tag: '极速到家', img: 'https://via.placeholder.com/600x600/222222/ffffff?text=COKI+Sneaker' },
            { id: 3, title: 'COKI 潮牌纯棉印花短袖T恤 男女同款', price: 169, sales: '1.2万人付款', tag: '鉴别通过', img: 'https://via.placeholder.com/600x600/222222/00f0ff?text=COKI+Tee' },
            { id: 4, title: 'COKI 棒球帽潮牌美式弯檐鸭舌帽', price: 99, sales: '4510人付款', tag: '鉴别通过', img: 'https://via.placeholder.com/600x600/222222/ffffff?text=COKI+Cap' }
        ];

        // 2. 新品上架数据（点击“新品上架”时渲染）
        const newProducts = [
            { id: 5, title: '【2026秋季新品】COKI 刺绣水洗牛仔夹克外套', price: 459, sales: '首发新品', tag: '新品鉴别', img: 'https://via.placeholder.com/600x600/1a2e3b/00f0ff?text=COKI+Jacket' },
            { id: 6, title: '【限时发售】COKI 极简黑武士机能工装裤', price: 299, sales: '新品上架', tag: '极速发货', img: 'https://via.placeholder.com/600x600/1a2e3b/ffffff?text=COKI+Pants' },
            { id: 7, title: 'COKI 银饰925银古巴链条潮牌项链', price: 189, sales: '新品上架', tag: '鉴别通过', img: 'https://via.placeholder.com/600x600/1a2e3b/00f0ff?text=COKI+Necklace' },
            { id: 8, title: 'COKI 联名款防水多功能背包', price: 349, sales: '少量现货', tag: '新品鉴别', img: 'https://via.placeholder.com/600x600/1a2e3b/ffffff?text=COKI+Backpack' }
        ];

        let currentTab = 'featured';

        // 渲染商品列表
        function renderProducts(list) {
            const container = document.getElementById('goodsContainer');
            container.style.display = 'grid';
            container.innerHTML = list.map(item => `
                <div class="goods-card" onclick="openModal('${item.img}', '${item.title}')">
                    <div class="goods-img-wrap">
                        <img class="goods-img" src="${item.img}" alt="${item.title}">
                        <div class="dewu-tag">${item.tag}</div>
                    </div>
                    <div class="goods-info">
                        <div class="goods-title">${item.title}</div>
                        <div class="goods-price-row">
                            <div>
                                <span class="price-symbol">¥</span>
                                <span class="price-num">${item.price}</span>
                            </div>
                            <span class="want-num">${item.sales}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Tab 切换逻辑
        function switchTab(element, type) {
            currentTab = type;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const filterBar = document.getElementById('filterBar');
            const container = document.getElementById('goodsContainer');

            if (type === 'featured') {
                filterBar.style.display = 'flex';
                renderProducts(featuredProducts);
            } else if (type === 'new') {
                filterBar.style.display = 'flex';
                renderProducts(newProducts); // 加载新品数据
            } else if (type === 'community') {
                filterBar.style.display = 'none';
                container.style.display = 'block';
                container.innerHTML = '<div class="content-placeholder">📸 COKI 穿搭社区正在加载潮流达人秀...</div>';
            } else if (type === 'dynamic') {
                filterBar.style.display = 'none';
                container.style.display = 'block';
                container.innerHTML = '<div class="content-placeholder">📢 店铺最新动态：下周五晚8点 2026AW 新品首发！</div>';
            }
        }

        // 排序选项切换
        function switchFilter(element) {
            document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            // 此处可扩展重新排序逻辑
        }

        // 关注按钮状态切换
        let isFollowed = false;
        function toggleFollow() {
            const btn = document.getElementById('btnFollow');
            isFollowed = !isFollowed;
            if (isFollowed) {
                btn.innerText = '已关注';
                btn.classList.add('followed');
            } else {
                btn.innerText = '+ 关注';
                btn.classList.remove('followed');
            }
        }

        // 点击商品看大图弹窗
        function openModal(imgUrl, title) {
            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        // 初始化页面渲染
        renderProducts(featuredProducts);
    </script>
</body>
</html>
