<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coki shop — 桌面美学选品店</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <style>
    :root { --dewu-black: #121212; --dewu-cyan: #00f0ff; --dewu-neon: #ccff00; --bg-gray: #f6f6f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg-gray); color: var(--dewu-black); padding-bottom: 90px; }
    header { background-color: var(--dewu-black); padding: 14px 16px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: 900; color: #fff; font-style: italic; }
    .logo span { color: var(--dewu-cyan); }
    .cart-btn { background: rgba(255, 255, 255, 0.15); padding: 8px 14px; border-radius: 20px; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .cart-badge { background: var(--dewu-neon); color: var(--dewu-black); font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 10px; }
    .banner-wrapper { padding: 12px 16px 0; }
    .hero-banner { background: #000; border-radius: 18px; padding: 20px; color: #fff; }
    .banner-tag { background: var(--dewu-cyan); color: #000; font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
    .product-card { background: #fff; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .img-wrapper { width: 100%; height: 170px; background: #eee; position: relative; }
    .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .hot-badge { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 3px 7px; border-radius: 10px; }
    .product-info { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
    .product-name { font-size: 12px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; }
    .price-bar { display: flex; justify-content: space-between; align-items: center; }
    .price-num { font-size: 14px; font-weight: 900; }
    .add-btn { background: var(--dewu-black); color: #fff; border: none; padding: 6px 12px; border-radius: 14px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px 16px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
    .checkout-now-btn { background: var(--dewu-black); color: var(--dewu-neon); border: none; padding: 12px 24px; border-radius: 20px; font-weight: 900; cursor: pointer; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: flex-end; }
    .modal-overlay.active { display: flex; }
    .checkout-card { background: #fff; width: 100%; border-radius: 24px 24px 0 0; padding: 24px 20px 30px; }
    .input-field { width: 100%; box-sizing: border-box; background: #f4f4f6; border: none; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; }
    .submit-order-btn { width: 100%; background: #0084ff; color: #fff; border: none; padding: 15px; border-radius: 12px; font-weight: 900; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Coki shop<span>.STORE</span></div>
    <div class="cart-btn" onclick="openCheckout()">🛒 清单 <span class="cart-badge" id="cart-count">0</span></div>
  </header>

  <div class="banner-wrapper">
    <div class="hero-banner">
      <span class="banner-tag">VANITY ORGANIZER</span>
      <h2 style="font-size:20px; margin-bottom:4px;">Coki shop 化妆台专区</h2>
      <p style="font-size:12px; color:#aaa;">TikTok 粉丝专属优惠 · 支持货到付款 (COD)</p>
    </div>
  </div>

  <div class="product-grid" id="main-product-grid">加载中...</div>

  <div class="bottom-bar">
    <div>
      <div style="font-size: 11px; color: #888;">合计总价：</div>
      <div style="font-size:18px; font-weight:900;" id="total-price-display">0 MMK</div>
    </div>
    <button class="checkout-now-btn" onclick="openCheckout()">确认下单</button>
  </div>

  <div class="modal-overlay" id="checkout-modal">
    <div class="checkout-card">
      <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
        <b style="font-size:18px;">填写送货信息</b>
        <span onclick="closeCheckout()" style="cursor:pointer;">✕</span>
      </div>
      <div id="order-summary" style="background:#f8f8f8; padding:10px; border-radius:8px; margin-bottom:12px; font-size:12px;"></div>
      <input type="text" class="input-field" id="cust-name" placeholder="您的姓名 (Name)">
      <input type="tel" class="input-field" id="cust-phone" placeholder="联系电话 (Phone)">
      <input type="text" class="input-field" id="cust-address" placeholder="送货地址 (City / Township)">
      <button class="submit-order-btn" onclick="sendOrder()">💬 提交并复制订单信息</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://keaokbwzveijlntfcjn.supabase.co';
    const SUPABASE_KEY = 'Sb_secret_LHZHZvSiwtm_xyM0ulbLFA_uvPMvA3G';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cart = [];
    let totalPrice = 0;

    async function loadProducts() {
      try {
        const { data, error } = await db.from('products').select('*').order('id', { ascending: false });
        const grid = document.getElementById('main-product-grid');
        
        if (error || !data || data.length === 0) {
          grid.innerHTML = '<div style="grid-column: span 2; text-align:center; padding:40px; color:#888;">暂无商品，请在后台添加</div>';
          return;
        }

        let html = '';
        data.forEach(p => {
          html += `
            <div class="product-card">
              <div class="img-wrapper">
                <img src="${p.image}" onerror="this.src='https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500'">
                ${p.badge ? `<div class="hot-badge">${p.badge}</div>` : ''}
              </div>
              <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="price-bar">
                  <span class="price-num">${Number(p.price).toLocaleString()} MMK</span>
                  <button class="add-btn" onclick="addToCart('${p.name}', ${p.price})">+ 选择</button>
                </div>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;
      } catch(err) {
        document.getElementById('main-product-grid').innerHTML = '<div style="grid-column: span 2; text-align:center; padding:40px; color:#888;">数据加载失败</div>';
      }
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      totalPrice += price;
      document.getElementById('cart-count').innerText = cart.length;
      document.getElementById('total-price-display').innerText = totalPrice.toLocaleString() + ' MMK';
    }

    function openCheckout() {
      if (cart.length === 0) return alert('请先选择至少一款商品');
      let summary = '';
      cart.forEach((item, i) => { summary += `<div>${i+1}. ${item.name} - ${item.price.toLocaleString()} MMK</div>`; });
      document.getElementById('order-summary').innerHTML = summary;
      document.getElementById('checkout-modal').classList.add('active');
    }

    function closeCheckout() { document.getElementById('checkout-modal').classList.remove('active'); }

    function sendOrder() {
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;
      if (!name || !phone || !address) return alert('请填写完整信息');

      let msg = `🛒【Coki shop 官网新订单】\n👤 姓名: ${name}\n📞 电话: ${phone}\n📍 地址: ${address}\n\n📦 商品列表:\n`;
      cart.forEach((item, i) => { msg += `${i + 1}. ${item.name} (${item.price.toLocaleString()} MMK)\n`; });
      msg += `\n💰 总额: ${totalPrice.toLocaleString()} MMK (COD货到付款)`;

      navigator.clipboard.writeText(msg).then(() => {
        alert("订单已复制！可以直接发送给客服消息。");
        closeCheckout();
      });
    }

    loadProducts();
  </script>
</body>
</html>
