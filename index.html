<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coki Official Store</title>
  <style>
    :root {
      --manga-black: #111111;
      --manga-white: #ffffff;
      --manga-gray: #f7f7f7;
      --accent-pink: #ff69b4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--manga-gray); color: var(--manga-black); padding: 12px 12px 100px; max-width: 480px; margin: 0 auto; }

    /* 顶部海报风格 */
    .hero-banner {
      background: var(--manga-black);
      color: var(--manga-white);
      border: 3px solid var(--manga-black);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
    }
    .hero-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 4px; }
    .hero-sub { font-size: 11px; font-weight: 700; color: #ccc; }
    
    /* 蓝勾认证与小贴士 */
    .trust-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: #e8f4fd; color: #1d9bf0;
      font-size: 10px; font-weight: 800; padding: 3px 8px;
      border-radius: 20px; border: 1.5px solid #1d9bf0;
      margin-top: 10px;
    }

    /* COD 提示条 */
    .cod-notice {
      background: #fff;
      border: 2px solid var(--manga-black);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 11px; font-weight: 800;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
      box-shadow: 2px 2px 0px var(--manga-black);
    }

    /* 商品网格 */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product-card {
      background: var(--manga-white);
      border: 2.5px solid var(--manga-black);
      border-radius: 14px;
      padding: 10px;
      position: relative;
      box-shadow: 3px 3px 0px var(--manga-black);
      cursor: pointer;
    }
    .product-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--manga-black); }

    .badge {
      position: absolute; top: 16px; left: 16px;
      background: var(--manga-black); color: var(--manga-white);
      font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px;
      z-index: 2;
    }

    .product-img {
      width: 100%; height: 150px; object-fit: cover;
      border: 2px solid var(--manga-black); border-radius: 10px;
      background: #eee; margin-bottom: 8px;
    }

    .product-name {
      font-size: 12px; font-weight: 800; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      height: 32px; margin-bottom: 6px;
    }

    .product-price {
      font-size: 13px; font-weight: 900; color: var(--manga-black);
    }

    /* 底部购物车栏 */
    .bag-bar {
      position: fixed; bottom: 16px; left: 12px; right: 12px; max-width: 456px; margin: 0 auto;
      background: var(--manga-black); color: var(--manga-white);
      border: 2.5px solid var(--manga-black); border-radius: 16px;
      padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
    .bag-text { font-size: 12px; font-weight: 800; }
    .bag-btn {
      background: var(--manga-white); color: var(--manga-black);
      border: none; padding: 8px 16px; border-radius: 10px;
      font-size: 11px; font-weight: 900; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 顶部精美海报与蓝勾 -->
  <div class="hero-banner">
    <div class="hero-title">🖤 COKI OFFICIAL</div>
    <div class="hero-sub">Kawaii Selection & Daily Fashion</div>
    <div class="trust-badge">
      ✓ Verified Store & Official Partner
    </div>
  </div>

  <!-- COD 货到付款说明 -->
  <div class="cod-notice">
    <span>📦 Support Cash on Delivery (COD)</span>
    <span style="color: #666; font-size: 10px;">Fast Shipping</span>
  </div>

  <!-- 商品列表容器 -->
  <div class="product-grid" id="product-list">
    <div style="grid-column: span 2; text-align: center; padding: 40px; font-size: 12px; font-weight: 700; color: #888;">Loading products...</div>
  </div>

  <!-- 底部结算栏 -->
  <div class="bag-bar">
    <div class="bag-text">🛍️ Bag: <span id="bag-count">0</span> items</div>
    <button class="bag-btn" onclick="checkout()">Checkout</button>
  </div>

  <script>
    let bagCount = 0;

    // 从 GitHub 的 products.json 实时读取商品
    async function loadProducts() {
      try {
        const response = await fetch('products.json?' + new Date().getTime());
        if (!response.ok) throw new Error('Failed to load');
        
        const products = await response.json();
        renderProducts(products);
      } catch (err) {
        console.error(err);
        document.getElementById('product-list').innerHTML = `
          <div style="grid-column: span 2; text-align: center; padding: 30px; font-size: 11px; font-weight: 700; color: #888;">
            Please check your products.json file in repository!
          </div>`;
      }
    }

    // 渲染商品
    function renderProducts(products) {
      const container = document.getElementById('product-list');
      if (!products || products.length === 0) {
        container.innerHTML = '<div style="grid-column: span 2; text-align: center; padding: 30px; font-size: 11px; font-weight: 700; color: #888;">Store is empty.</div>';
        return;
      }

      container.innerHTML = products.map(p => `
        <div class="product-card" onclick="addToBag('${escapeHtml(p.name)}', ${p.price})">
          ${p.badge ? `<div class="badge">${escapeHtml(p.badge)}</div>` : ''}
          <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" class="product-img">
          <div class="product-name">${escapeHtml(p.name)}</div>
          <div class="product-price">${Number(p.price).toLocaleString()} MMK</div>
        </div>
      `).join('');
    }

    function addToBag(name, price) {
      bagCount++;
      document.getElementById('bag-count').innerText = bagCount;
    }

    function checkout() {
      if (bagCount === 0) {
        alert('Your bag is empty!');
        return;
      }
      alert('Checkout feature coming soon! Total items: ' + bagCount);
    }

    function escapeHtml(str) { 
      return str ? str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : ''; 
    }

    loadProducts();
  </script>
</body>
</html>
